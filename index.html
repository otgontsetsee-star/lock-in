<!doctype html><html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEBE7">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Lock In">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Lock In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: two screens behind a floating black pill nav. Soft pastel tiles (lavender, butter, sage, mint, blush) on a warm peach ground; light-weight big numerals, heavy emphasis words; a mountain climb shows real progress vs schedule. */
:root{
  --bg:#ECEBE7; --paper:#FBFAF7; --ink:#17171A; --soft:#7A726C; --rule:#EADFD7; --tint:#F0EAE5;
  --lav:#C3C6F7; --butter:#F0DC95; --sage:#B4C29E; --mint:#CDE5DD; --blush:#EECDBF;
  --sig:#D9694F; --sig-soft:#F8DDD4; --ok:#5E8B5A; --ok-soft:#DCE9D3;
  --head:"Oswald","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1817; --paper:#262220; --ink:#F4EFEA; --soft:#A79E97; --rule:#36302D; --tint:#2F2A27;
  --lav:#4C4F86; --butter:#7A6A35; --sage:#4F5D41; --mint:#3B5A51; --blush:#6E4A3E;
  --sig:#F0896F; --sig-soft:#4A2A22; --ok:#9CC995; --ok-soft:#2D3D2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1817; --paper:#262220; --ink:#F4EFEA; --soft:#A79E97; --rule:#36302D; --tint:#2F2A27;
  --lav:#4C4F86; --butter:#7A6A35; --sage:#4F5D41; --mint:#3B5A51; --blush:#6E4A3E;
  --sig:#F0896F; --sig-soft:#4A2A22; --ok:#9CC995; --ok-soft:#2D3D2A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{font-size:12px;font-weight:600;color:var(--soft)}
.box{background:var(--paper);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px}
.top .who{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.top .who::before{content:"";width:14px;height:14px;background:var(--ink);transform:rotate(45deg);border-radius:3px}
.top .clk{font-family:var(--mono);font-size:13px;color:var(--soft);background:var(--paper);padding:6px 12px;border-radius:99px}

/* hero */
.hero{background:var(--paper);gap:6px}
.hero .k{color:var(--soft)}
.hero .d{font-weight:300;font-size:clamp(72px,24vw,112px);line-height:.9;letter-spacing:-.04em;display:flex;align-items:flex-end;gap:10px}
.hero .d small{font-size:20px;font-weight:800;letter-spacing:0;padding-bottom:10px}
.hero .t{font-family:var(--mono);font-weight:500;font-size:clamp(22px,7vw,30px);color:var(--sig);line-height:1}
.hero .g{font-weight:300;font-size:22px;line-height:1.2;margin-top:8px}
.hero .g b{font-weight:800}
.bar{height:10px;background:var(--tint);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.hero .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);gap:8px;flex-wrap:wrap}

/* mountain */
.mtn{background:var(--butter);gap:10px}
.mtn h2{margin:0;font-weight:300;font-size:22px;line-height:1.2}
.mtn h2 b{font-weight:800}
.mtn-art svg{width:100%;height:auto;display:block;border-radius:16px}
.mtn .legend{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.mtn .legend div{background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.mtn .legend b{font-weight:300;font-size:26px;line-height:1;letter-spacing:-.02em}
.mtn .legend span{font-size:11px;font-weight:600;color:var(--soft);margin-top:4px}
.mtn .chip{font-size:12px;font-weight:800;padding:8px 12px;border-radius:99px;background:var(--ink);color:var(--paper);text-align:center}
.mtn .chip.behind{background:var(--sig);color:#fff}

/* formula */
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:13px}
.formula span{padding:7px 12px;border-radius:99px;background:var(--tint)}
.formula span:nth-of-type(1){background:var(--lav)}.formula span:nth-of-type(2){background:var(--butter)}
.formula span:nth-of-type(3){background:var(--blush)}.formula span:nth-of-type(4){background:var(--sage)}
.formula span:nth-of-type(5){background:var(--mint)}.formula span:nth-of-type(6){background:var(--lav)}
.formula b{font-weight:300;color:var(--soft)}
.formula span.end{background:var(--ink);color:var(--paper)}

/* levels */
.lv{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--r);position:relative}
.lv.c1{background:var(--lav)}.lv.c2{background:var(--butter)}.lv.c3{background:var(--paper)}.lv.c4{background:var(--sage)}.lv.c5{background:var(--paper)}
.lv .n{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--ink) 10%,transparent);display:grid;place-items:center;font-weight:800;font-size:13px}
.lv .b{display:flex;flex-direction:column;gap:8px;min-width:0}
.lv .lab{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding-right:44px}
.lv .lab b{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.lv .lab span{font-size:12px;font-weight:600;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.lv h2{margin:0;font-weight:300;font-size:24px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.lv .date{font-family:var(--mono);font-size:13px;font-weight:500}
.crit{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--paper) 60%,transparent);border-radius:16px;padding:12px}
.cr{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-size:14px}
.cr i{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 30%,transparent);display:block}
.cr.done i{background:var(--ok);border-color:var(--ok)}
.cr .num{font-size:13px}
.ph{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--rule);align-items:start}
.ph:first-child{border-top:0;padding-top:0}
.ph .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;border:2px solid var(--rule)}
.ph.cur .dot{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 4px var(--butter)}
.ph.done .dot{background:var(--ok);border-color:var(--ok)}
.ph strong{display:block;font-size:15px}
.ph p{margin:2px 0 0;font-size:13px;color:var(--soft)}
.ph .num{font-size:12px;color:var(--soft);white-space:nowrap}
.ph.late .num{color:var(--sig);font-weight:700}
.st{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.st:first-child{border-top:0}
.st .num{font-weight:700}
.st p{margin:0;font-size:14px;font-weight:600}
.st p small{display:block;color:color-mix(in srgb,var(--ink) 60%,transparent);font-size:12px;font-weight:500}
.dsc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dsc div{background:var(--tint);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.dsc b{font-weight:300;font-size:28px;line-height:1;letter-spacing:-.02em}
.dsc span{font-size:11px;font-weight:600;color:var(--soft);margin-top:6px}
.dsc b.bad{color:var(--sig)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;background:var(--sage);border-radius:99px;min-height:8px}
.wk i.lo{background:var(--blush)}
.wk span{font-size:10px;color:var(--soft);font-weight:700}
.wk .today i{background:var(--ink)}
.tc{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--rule)}
.tc .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tc .sub{font-size:12px;color:var(--soft)}
.verdict{margin:0;font-size:13px;font-weight:600;background:var(--sig-soft);border-radius:14px;padding:10px 12px}
.make{font-weight:300;font-size:24px;text-align:center;padding:10px 0 4px}
.make em{font-style:normal;font-weight:800}

/* progress logger */
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.q:first-of-type{border-top:0}
.q .nm{font-weight:700}.q .nm small{display:block;font-weight:600;font-size:12px;color:var(--sig)}
.q .nm small.met{color:var(--ok)}
.stp{display:flex;align-items:center;gap:6px}
.stp .num{min-width:58px;text-align:center;font-weight:500}
.sb{width:40px;height:40px;border-radius:50%;border:0;background:var(--tint);font-weight:700;font-size:18px;padding:0}
.sb.p{background:var(--ink);color:var(--paper)}
.tg{display:flex;align-items:center;gap:10px;border:0;background:var(--tint);border-radius:16px;padding:14px;font-weight:700;width:100%;text-align:left}
.tg b{width:22px;height:22px;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-size:13px;flex:none}
.tg.on b{background:var(--ok);border-color:var(--ok);color:#fff}
.setup{display:flex;gap:8px}
.setup input{flex:1;min-width:0;background:var(--tint);border:0;border-radius:14px;padding:12px}
.btn{border:0;background:var(--tint);border-radius:99px;padding:13px 18px;font-weight:700;font-size:14px}
.btn.s{background:var(--sig);color:#fff}
.btn.i{background:var(--ink);color:var(--paper)}

/* today */
.alarm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border-radius:20px;padding:12px 14px}
.alarm .bell{width:34px;height:34px;border-radius:50%;background:var(--butter);font-size:0;position:relative}
.alarm .bell::after{content:"";position:absolute;inset:10px;border-radius:50% 50% 3px 3px;border:2px solid var(--ink)}
.alarm strong{display:block;font-size:14px}
.alarm small{display:block;font-size:12px;color:var(--soft)}
.alarm .in{font-family:var(--mono);font-weight:500;font-size:14px;white-space:nowrap;background:var(--tint);padding:6px 10px;border-radius:99px}
.now{background:var(--lav)}
.now.late{background:var(--blush)}
.now.calm{background:var(--paper)}
.now .k{color:color-mix(in srgb,var(--ink) 65%,transparent)}
.now h2{margin:0;font-weight:300;font-size:28px;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.now p{margin:0;font-size:14px;color:color-mix(in srgb,var(--ink) 70%,transparent)}
.now .btn{background:color-mix(in srgb,var(--paper) 70%,transparent)}
.now .btn.i{background:var(--ink);color:var(--paper)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.part{display:flex;flex-direction:column;gap:8px}
.part>h3{margin:8px 4px 0;font-weight:300;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.part>h3 .num{font-size:13px;color:var(--soft)}
.hb{display:grid;grid-template-columns:52px 1fr 46px;gap:12px;align-items:center;background:var(--paper);border-radius:20px;padding:14px}
.hb .tm{font-family:var(--mono);font-weight:500;font-size:14px}
.hb .tx{min-width:0}
.hb .tx b{display:block;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.hb .tx small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.hb .tx .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--tint);margin-bottom:4px}
.hb.lock{background:var(--butter)}
.hb.lock .tag{background:var(--ink);color:var(--paper)}
.hb.isnow{box-shadow:0 0 0 2px var(--ink)}
.hb.late .tm{color:var(--sig);font-weight:700}
.hb.done{opacity:.6}
.hb.done .tx b{text-decoration:line-through}
.hb.rew{background:var(--mint)}
.ck{width:46px;height:46px;border-radius:50%;border:0;background:var(--tint);padding:0;font-weight:800;font-size:18px;display:grid;place-items:center}
.hb.lock .ck,.hb.rew .ck{background:color-mix(in srgb,var(--paper) 70%,transparent)}
.hb.done .ck{background:var(--ok);color:#fff}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;margin-top:4px}
.pill.off{background:var(--sig-soft);color:var(--sig)}.pill.on{background:var(--ok-soft);color:var(--ok)}
.exl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ex{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.ex .m{width:24px;height:24px;border:2px solid var(--ink);border-radius:8px;background:transparent;padding:0;font-size:12px}
.ex.d .m{background:var(--ok);border-color:var(--ok);color:#fff}.ex.d span{text-decoration:line-through;color:var(--soft)}
.ex .rm{margin-left:auto;border:0;background:transparent;color:var(--soft);font-size:18px}
.adx{display:flex;gap:6px;margin-top:8px}
.adx input{flex:1;min-width:0;background:var(--tint);border:0;border-radius:99px;padding:10px 14px;font-size:14px}
.adx button{border:0;background:var(--ink);color:var(--paper);border-radius:50%;width:38px;height:38px;font-weight:800}
.note{font-size:12px;color:var(--soft);text-align:center}

/* floating pill nav */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs .in{display:flex;gap:6px;background:var(--paper);padding:6px;border-radius:99px;box-shadow:0 10px 30px rgba(60,40,30,.16);pointer-events:auto}
nav.tabs button{border:0;background:transparent;padding:12px 22px;border-radius:99px;font-weight:700;font-size:14px;color:var(--soft)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:#17171A;color:#F4EFEA;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ov .k{color:#F0DC95;font-weight:700;font-size:13px}
.ov h2{margin:0;font-weight:300;font-size:30px;line-height:1.15;max-width:460px}
.ov .tmr{font-family:var(--mono);font-weight:300;font-size:clamp(68px,22vw,128px);line-height:.9;color:#C3C6F7}
.ov p{margin:0;font-size:14px;color:#A79E97;max-width:360px}
.ov .btn{color:#F4EFEA;background:#2B2A2E}
.ov .btn.s{background:#C3C6F7;color:#17171A}
.ov .btn[aria-pressed="true"]{background:#F4EFEA;color:#17171A}
.ov .warn{color:#F0896F;font-weight:700;font-size:14px}
.loading{padding:80px 0;text-align:center;color:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* headings back to Oswald */
.hero .d,.hero .g,.mtn h2,.lv h2,.now h2,.part>h3,.make,.ov h2,.dsc b,.mtn .legend b,.ov .tmr{font-family:var(--head)}
.hero .d{font-weight:600;letter-spacing:-.01em}
.hero .g,.mtn h2,.lv h2,.now h2,.ov h2{font-weight:500;text-transform:uppercase;letter-spacing:.01em}
.hero .g b,.mtn h2 b{font-weight:700}
.part>h3{font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:17px}
.make{font-weight:500;text-transform:uppercase}.make em{font-weight:700;color:var(--sig)}
.dsc b,.mtn .legend b{font-weight:500}
.ov .tmr{font-weight:600}

.legend2{display:flex;align-items:center;gap:6px 4px;background:var(--paper);border-radius:22px;padding:6px 6px 6px 14px;flex-wrap:wrap;min-width:0}
.legend2 .lg{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap}
.legend2 .lg b{color:var(--ink);font-weight:800;font-size:14px;margin-right:4px}
.legend2 i{width:12px;height:12px;border-radius:50%;display:block}
.legend2 i.you{background:#F5C531;border:1.5px solid #1D1D1F}
.legend2 i.plan{border:1.5px dashed #1D1D1F}
.legend2 .chip{margin-left:auto;padding:7px 11px;font-size:11px;white-space:nowrap}
.climb{background:#0E0E10;color:#F4F1EA;gap:10px;padding:20px 16px}
.climb-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px}
.climb .ck2{font-size:11px;font-weight:800;letter-spacing:.24em;color:#F5C531}
.climb .big{font-family:var(--head);font-weight:600;font-size:64px;line-height:.95;color:#F4F1EA;letter-spacing:-.02em}
.climb .big small{font-size:28px;color:#F5C531;margin-left:2px}
.climb .chip{font-size:12px;font-weight:800;padding:8px 12px;border-radius:99px;background:#1E1E21;color:#F4F1EA;white-space:nowrap}
.climb .chip.behind{background:#D9694F;color:#fff}
.climb .mtn-art svg{width:100%;height:auto;display:block}
.climb-foot{display:flex;gap:18px;padding:2px 6px;font-size:12px;color:#8B8B90;font-weight:600}
.climb-foot span{display:flex;align-items:center;gap:6px}.climb-foot b{color:#F4F1EA;font-weight:800}
.climb-foot i{width:10px;height:10px;border-radius:50%;display:block}
.climb-foot i.you{background:#F5C531}.climb-foot i.plan{border:1.5px dashed #8B8B90}
.ringc{gap:6px}
.ringc .rk{letter-spacing:.2em;font-weight:800}
.ring-wrap{position:relative;max-width:360px;width:100%;margin:0 auto}
.ring-art svg{width:100%;height:auto;display:block}
.ring-c{position:absolute;left:0;right:0;top:31%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22%}
.rbig{font-family:var(--body);line-height:1;letter-spacing:-.04em;display:flex;align-items:flex-start}
.rbig b{font-weight:800;font-size:clamp(60px,19vw,84px)}
.rbig span{font-weight:400;font-size:clamp(26px,8vw,36px);margin-top:.35em;margin-left:2px}
.rlab{margin-top:8px;font-size:9px;font-weight:800;letter-spacing:.18em;color:var(--soft)}
.rnext{margin-top:3px;font-size:14px;font-weight:800;line-height:1.2}
.rdays{margin-top:3px;font-size:12px;font-weight:600;color:var(--soft)}
.rpills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
